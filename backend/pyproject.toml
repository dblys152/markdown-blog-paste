[project]
name = "md2blog-backend"
version = "0.1.0"
description = "MD2Blog API server"
readme = "README.md"
authors = [
    { name = "dblys152", email = "dblys152@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "tsidpy>=1.1.5",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
md2blog-api = "md2blog.main:run"
md2blog-purge-expired-pages = "md2blog.jobs.purge_expired_pages:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/**/presentation/*.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["md2blog"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "md2blog"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]
